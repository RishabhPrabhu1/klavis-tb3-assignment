name: Submission Consistency

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: submission-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify frozen task and submission evidence
        run: python3 scripts/submission-consistency-audit.py

      - name: Compile Python tooling
        run: |
          python3 -m py_compile \
            scripts/audit-trial-evidence.py \
            scripts/submission-consistency-audit.py

      - name: Parse retained shell tooling
        run: |
          for script in \
            scripts/final-submission-audit.sh \
            scripts/run-candidate-trial.sh \
            scripts/run-codex-strong-test.sh \
            scripts/run-corrected-tree-local-qualification.sh \
            scripts/run-deadline-cheat-matrix.sh \
            scripts/run-deadline-claude-matrix.sh \
            scripts/run-deadline-sol-matrix.sh \
            scripts/run-final-tree-deadline-qualification.sh \
            scripts/run-implementation-rubric-oauth.sh \
            scripts/run-lifecycle-mutation-checks.sh \
            scripts/run-local-reference-tests.sh \
            scripts/run-mutation-checks.sh \
            scripts/run-nop.sh \
            scripts/run-oracle.sh \
            scripts/run-request-mutation-checks.sh \
            scripts/run-static-checks.sh \
            scripts/run-workspace-mutation-checks.sh \
            scripts/run-workspace-txn-mutation-checks.sh \
            scripts/setup-local-verifier-env.sh; do
            bash -n "$script"
          done

      - name: Confirm task subtree was not modified by checks
        run: test -z "$(git status --porcelain -- tasks/build-snapshot-publish)"

# Deterministic qualification is recorded separately and model calls are local,
# guarded, exact-tree runs. This workflow is read-only and never rewrites evidence.
