name: Submission Consistency

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: submission-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify frozen task and reviewer-facing evidence
        run: python3 scripts/submission-consistency-audit.py

      - name: Compile Python submission tooling
        run: |
          python3 -m py_compile \
            scripts/audit-trial-evidence.py \
            scripts/submission-consistency-audit.py

      - name: Parse authoritative shell entry points
        run: |
          bash -n scripts/run-final-tree-deadline-qualification.sh
          bash -n scripts/run-next-qualification-step.sh
          bash -n scripts/run-next-frontier-step.sh
          bash -n scripts/run-fast-frontier-cycle.sh
          bash -n scripts/resume-deadline-cycle.sh
          bash -n scripts/resume-macos-deadline-cycle.sh
          bash -n scripts/run-one-qualified-sol-probe.sh
          bash -n scripts/run-deadline-sol-matrix.sh
          bash -n scripts/run-deadline-cheat-matrix.sh
          bash -n scripts/run-deadline-claude-pipeline.sh
          bash -n scripts/final-submission-audit.sh

      - name: Confirm task subtree was not modified by checks
        run: test -z "$(git status --porcelain -- tasks/build-snapshot-publish)"

# Deterministic task qualification is intentionally not regenerated by this
# workflow. The frozen-tree static/reference/mutation/Harbor evidence is recorded
# separately and model calls are local, guarded, exact-tree runs. This workflow
# must never rewrite evidence files or create bot commits on the submission branch.
